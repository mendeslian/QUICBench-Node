worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format protocol '$remote_addr - [$time_local] '
                      '"$request" $status protocol="$server_protocol" '
                      'h3="$http3" request_time="$request_time" '
                      'upstream_time="$upstream_response_time"';
  access_log /dev/stdout protocol;

  # Keep it simple: proxy to Node running on the host.
  upstream node_api {
    server host.docker.internal:3000;
  }

  server {
    listen 8443 ssl;
    listen 8443 quic reuseport;

    http2 on;
    http3 on;
    add_header Alt-Svc 'h3=":8443"; ma=2592000' always;

    ssl_protocols TLSv1.3;
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    location / {
      proxy_pass http://node_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
